services:
  postgres:
    image: postgres:16-alpine
    container_name: lowkey-postgres
    environment:
      POSTGRES_DB: lowkey
      POSTGRES_USER: lowkey
      POSTGRES_PASSWORD: lowkey
    ports:
      - "5432:5432"
    volumes:
      - lowkey_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lowkey -d lowkey"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lowkey-redis
    ports:
      - "6379:6379"
    volumes:
      - lowkey_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lowkey_pg_data:
  lowkey_redis_data:
