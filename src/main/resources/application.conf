ktor {
    deployment {
        # Listen on all interfaces so phones on the same LAN can reach the API.
        host = "0.0.0.0"
        host = ${?HOST}
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.lowkey.backend.ApplicationKt.module ]
    }
}

database {
    # JDBC URL. Override with DATABASE_URL (e.g. jdbc:postgresql://localhost:5432/lowkey)
    url = "jdbc:postgresql://localhost:5432/lowkey"
    url = ${?DATABASE_URL}
    user = "lowkey"
    user = ${?DATABASE_USER}
    password = "lowkey"
    password = ${?DATABASE_PASSWORD}
    driver = "org.postgresql.Driver"
    maxPoolSize = 10
}

redis {
    # Override with REDIS_URL (e.g. redis://localhost:6379)
    url = "redis://localhost:6379"
    url = ${?REDIS_URL}
}

alerts {
    # Haversine radius for SOS neighbor lookup (meters).
    sosRadiusMeters = 500
    sosRadiusMeters = ${?SOS_RADIUS_METERS}
    # Redis TTL for ephemeral approximate locations (seconds). Never written to Postgres.
    locationTtlSeconds = 300
    locationTtlSeconds = ${?LOCATION_TTL_SECONDS}
}

fcm {
    # Set FCM_ENABLED=true and provide project id + credentials (path or inline JSON).
    enabled = false
    enabled = ${?FCM_ENABLED}
    projectId = ""
    projectId = ${?FCM_PROJECT_ID}
    credentialsPath = ""
    credentialsPath = ${?GOOGLE_APPLICATION_CREDENTIALS}
    credentialsJson = ""
    credentialsJson = ${?FCM_CREDENTIALS_JSON}
}

retention {
    # Purge Account metadata (device token history, last-seen IPs, stale active tokens)
    # older than this many days. AuditLog records each purge for lawful-access queries.
    days = 90
    days = ${?RETENTION_DAYS}
}
